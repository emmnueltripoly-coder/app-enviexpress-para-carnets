# render.yaml — Configuración declarativa de Render.
#
# IMPORTANTE: este archivo NO contiene secretos.
# Las variables marcadas con "sync: false" DEBEN configurarse manualmente
# en el panel de Render (Settings → Environment).
# Ver DESPLIEGUE.md para la guía paso a paso.

services:
  - type: web
    name: enviexpress-asistencia
    runtime: python
    buildCommand: "./build.sh"
    startCommand: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 120
      --log-level info
    healthCheckPath: /api/health/
    autoDeploy: true

    envVars:
      # --- Django core ---
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false      # Generar con: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
      - key: ALLOWED_HOSTS
        sync: false      # Ej: enviexpress-asistencia.onrender.com,tudominio.com

      # --- Base de datos (Supabase) ---
      - key: DATABASE_URL
        sync: false      # Copiar desde Supabase: Project Settings → Database → URI
      - key: CONN_MAX_AGE
        value: "0"       # 0 = sin conexiones persistentes (seguro con pooler de Supabase)

      # --- Superusuario inicial ---
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false

      # --- CSRF (requerido para el panel admin con DEBUG=False + HTTPS) ---
      - key: CSRF_TRUSTED_ORIGINS
        sync: false      # Ej: https://control-asistencia-yhp7.onrender.com

      # --- CORS (app móvil web / futuros frontends) ---
      - key: CORS_ALLOWED_ORIGINS
        sync: false      # Ej: https://tuapp.com,https://panel.tudominio.com

      # --- Email (notificaciones de novedades) ---
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: DEFAULT_FROM_EMAIL
        value: "no-responder@enviexpresslogistica.com"
      - key: EMAIL_HOST
        sync: false      # Ej: smtp.gmail.com  /  smtp.sendgrid.net
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false      # Contraseña de app (Gmail) o API key (SendGrid)
      - key: EMAIL_USE_TLS
        value: "True"
      - key: NOVEDADES_EMAILS
        sync: false      # Ej: rrhh@empresa.com,jefe@empresa.com

      # --- Supabase Storage (soportes de novedades — datos sensibles) ---
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false      # Supabase: Project Settings → Storage → S3 Access Key
      - key: SUPABASE_S3_SECRET_KEY
        sync: false      # Supabase: Project Settings → Storage → S3 Secret Key
      - key: SUPABASE_STORAGE_BUCKET
        sync: false      # Nombre del bucket PRIVADO creado en Supabase Storage
      - key: SUPABASE_S3_ENDPOINT_URL
        sync: false      # Ej: https://<project-id>.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        value: "us-east-1"

      # --- Python / pip ---
      - key: PYTHON_VERSION
        value: "3.11"
